name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install uv
        run: python -m pip install uv==0.12.0
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run --locked ruff check src tests scripts
      - name: Verify model catalog
        run: uv run --locked python scripts/generate_models.py --check
      - name: Test
        run: uv run --locked python -m pytest -q
      - name: Build distributions
        run: uv run --locked python -m build
      - name: Smoke-test wheel
        run: uv run --locked python scripts/smoke_wheel.py
