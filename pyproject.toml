[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piY"
dynamic = ["version"]
description = "piY AI coding agent for the terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "piY Contributors" }]
keywords = ["ai", "llm", "agent", "coding-agent", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pydantic>=2.11",
    "httpx>=0.28",
    "rich>=14.0",
    "prompt-toolkit>=3.0",
    "click>=8.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.12",
]

[project.scripts]
piY = "pi.coding_agent.cli:main"

[project.urls]
Repository = "https://github.com/Swyoung-dd/pi-base-python"

[tool.hatch.build.targets.wheel]
packages = ["src/pi"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/scripts",
    "/src",
    "/tests",
]

[tool.hatch.version]
path = "src/pi/__init__.py"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]
